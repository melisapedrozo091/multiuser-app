<div class="card product-card" [appHighlight]="'rgba(239, 68, 68, 0.15)'" [highlightCondition]="product.stock < 5">
  <div class="badge" *ngIf="product.stock < 5">⚡ ¡Últimos Cupos! ({{ product.stock }})</div>

  <div class="card-header">
    <div class="category-icon">{{ categoryIcon }}</div>
    <div class="title-container">
      <h3 class="product-title">{{ product.name }}</h3>
      <div class="rating-info">{{ ratingStars }}</div>
    </div>
  </div>

  <p class="description">{{ product.description || 'Sin descripción disponible.' }}</p>

  <div class="card-price-section">
    <span class="price-label">Inversión / Valor:</span>
    <span class="price-value">{{ formattedPrice }}</span>
  </div>

  <div class="card-footer">
    <div class="stock-info">Vacantes: <strong>{{ product.stock }}</strong></div>
    <div class="actions">
      <button class="btn btn-secondary btn-detail" (click)="onViewDetail()">📖 Temario</button>
      <button *ngIf="auth.currentUser" class="btn btn-secondary btn-pdf" (click)="downloadSyllabusPdf()" title="Descargar Plan de Estudios en PDF">📄 PDF</button>
      <button class="btn btn-primary btn-enroll" (click)="onBuy()">🎓 Inscribirse</button>
      <ng-container *ngIf="isAdmin">
        <button class="btn btn-secondary btn-icon" (click)="onEdit()" title="Editar">✏️</button>
        <button class="btn btn-danger btn-icon" (click)="onDelete()" title="Eliminar">🗑️</button>
      </ng-container>
    </div>
  </div>
</div>
