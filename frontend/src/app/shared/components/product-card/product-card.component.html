<div class="card product-card" [appHighlight]="'rgba(239, 68, 68, 0.15)'" [highlightCondition]="product.stock < 5">
  <div class="badge bg-danger text-white" *ngIf="product.stock < 5">
    <i class="fa-solid fa-bolt me-1"></i> ¡Últimos Cupos! ({{ product.stock }})
  </div>

  <div class="card-header">
    <div class="category-icon">{{ categoryIcon }}</div>
    <div class="title-container">
      <h3 class="product-title" [title]="product.name">{{ product.name }}</h3>
      <div class="rating-info">
        <i class="fa-solid fa-star text-warning me-1"></i> 4.9 (120+ alumnos)
      </div>
    </div>
  </div>

  <p class="description" [title]="product.description || ''">{{ product.description || 'Sin descripción disponible.' }}</p>

  <div class="card-price-section">
    <span class="price-label">Inversión / Valor:</span>
    <span class="price-value">{{ formattedPrice }}</span>
  </div>

  <div class="card-footer">
    <div class="footer-meta">
      <span><i class="fa-solid fa-users text-muted me-1"></i> Vacantes: <strong>{{ product.stock }}</strong></span>
      <span class="text-success" style="font-weight: 600; font-size: 0.78rem;"><i class="fa-solid fa-circle-check me-1"></i> Online Live</span>
    </div>
    <div class="actions">
      <button class="btn btn-secondary btn-detail" (click)="onViewDetail()">
        <i class="fa-solid fa-book-open me-1"></i> Temario
      </button>
      
      <button class="btn btn-secondary btn-pdf" (click)="downloadSyllabusPdf()" title="Descargar Plan de Estudios Oficial (PDF)">
        <i class="fa-solid fa-file-pdf me-1 text-danger"></i> PDF
      </button>
      
      <button class="btn btn-primary btn-enroll" (click)="onBuy()">
        <i class="fa-solid fa-graduation-cap me-1"></i> Inscribirse
      </button>
      
      <ng-container *ngIf="isAdmin">
        <button class="btn btn-secondary btn-icon" (click)="onEdit()" title="Editar Curso">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button class="btn btn-danger btn-icon" (click)="onDelete()" title="Eliminar Curso">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </ng-container>
    </div>
  </div>
</div>
