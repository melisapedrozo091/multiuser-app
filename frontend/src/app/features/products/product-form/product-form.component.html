<div class="form-container">
  <div class="card form-card">
    <h2>{{ isEdit ? 'Editar Producto/Servicio' : 'Nuevo Producto/Servicio' }}</h2>
    <p class="subtitle">Completa el formulario para dar de alta o modificar la oferta</p>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre del Producto *</label>
        <input type="text" formControlName="name" class="form-control" placeholder="Ej: Servidor VPS Pro" />
        <span class="error" *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">
          Nombre requerido (mínimo 3 caracteres)
        </span>
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea formControlName="description" class="form-control" rows="3" placeholder="Detalles o especificaciones..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label>Precio ($) *</label>
          <input type="number" formControlName="price" class="form-control" step="0.01" />
          <span class="error" *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
            El precio debe ser mayor a 0
          </span>
        </div>

        <div class="form-group half">
          <label>Stock Inicial *</label>
          <input type="number" formControlName="stock" class="form-control" />
          <span class="error" *ngIf="productForm.get('stock')?.invalid && productForm.get('stock')?.touched">
            Stock debe ser mayor o igual a 0
          </span>
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid || loading">
          {{ loading ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Guardar Producto') }}
        </button>
      </div>
    </form>
  </div>
</div>
